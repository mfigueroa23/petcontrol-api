# Pipeline de integración continua (CDM-3, SDD 5.4).
# En cada PR y push a main: formato, lint, pruebas unitarias, compilación y
# pruebas de integración con una base de datos PostgreSQL temporal.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 26
  IMAGE_NAME: petcontrol-api

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión de package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Evita sobrescribir una versión publicada: cada PR debe subir la versión.
      - name: Comprobar que la versión no esté publicada
        env:
          IMAGE: ${{ secrets.DOCKERHUB_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada en Docker Hub. Sube la versión en package.json."
            exit 1
          fi
          echo "La versión $VERSION no está publicada."

  quality:
    name: Formato, lint, pruebas unitarias y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # El postinstall genera el cliente de Prisma, sin necesitar base de datos.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el formato
        run: pnpm format:check

      - name: Revisar el código
        run: pnpm lint:check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Compilar
        run: pnpm build

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Base de datos temporal del entorno de integración continua (ADR-011).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petcontrol
          POSTGRES_PASSWORD: petcontrol
          POSTGRES_DB: petcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcontrol -d petcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petcontrol:petcontrol@localhost:5432/petcontrol?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Aplica las migraciones como en Producción, incluido su SQL manual.
      - name: Aplicar las migraciones
        run: pnpm db:deploy

      - name: Pruebas de integración
        run: pnpm test:e2e
