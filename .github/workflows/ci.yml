# Pipeline de integración continua (CDM-3, SDD 5.4).
# En cada PR y push a main: formato, lint, pruebas unitarias, compilación y
# pruebas de integración con una base de datos PostgreSQL temporal, y prueba de
# humo de la imagen construida (migraciones y arranque de la API). Solo en main,
# y si todo se aprueba, publica en Docker Hub la misma imagen probada con la
# etiqueta de su versión.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 26
  IMAGE_NAME: petcontrol-api

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión de package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Evita sobrescribir una versión publicada: cada PR debe subir la versión.
      - name: Comprobar que la versión no esté publicada
        env:
          IMAGE: ${{ secrets.DOCKERHUB_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada en Docker Hub. Sube la versión en package.json."
            exit 1
          fi
          echo "La versión $VERSION no está publicada."

  quality:
    name: Formato, lint, pruebas unitarias y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # El postinstall genera el cliente de Prisma, sin necesitar base de datos.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el formato
        run: pnpm format:check

      - name: Revisar el código
        run: pnpm lint:check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Compilar
        run: pnpm build

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Base de datos temporal del entorno de integración continua (ADR-011).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petcontrol
          POSTGRES_PASSWORD: petcontrol
          POSTGRES_DB: petcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcontrol -d petcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petcontrol:petcontrol@localhost:5432/petcontrol?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Aplica las migraciones como en Producción, incluido su SQL manual.
      - name: Aplicar las migraciones
        run: pnpm db:deploy

      - name: Pruebas de integración
        run: pnpm test:e2e

  # Prueba la imagen que se publicará: migraciones como el initContainer de
  # Kubernetes (SDD 5.5) y arranque de la API contra una base de datos temporal.
  smoke:
    name: Prueba de humo de la imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petcontrol
          POSTGRES_PASSWORD: petcontrol
          POSTGRES_DB: petcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcontrol -d petcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petcontrol:petcontrol@localhost:5432/petcontrol?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Los contenedores usan la red del runner para llegar al servicio postgres.
      - name: Aplicar las migraciones con la imagen
        run: docker run --rm --network host -e DATABASE_URL "$IMAGE_NAME:ci" ./node_modules/.bin/prisma migrate deploy

      # La API solo inicia si se conecta a la base de datos (PrismaService).
      - name: Levantar la API
        run: |
          docker run -d --name api --network host -e DATABASE_URL "$IMAGE_NAME:ci"
          timeout 30 sh -c 'until curl -fs http://localhost:3000/healthz; do sleep 1; done'

      - name: Comprobar la ruta de salud
        run: |
          RESPONSE=$(curl -fsS http://localhost:3000/healthz)
          if [ "$RESPONSE" != "ok" ]; then
            echo "::error::La ruta de salud respondió '$RESPONSE' en lugar de 'ok'."
            exit 1
          fi
          echo "La API respondió ok."

      - name: Comprobar que la API no se ejecute como root
        run: |
          USER_ID=$(docker exec api id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "::error::El contenedor de la API se ejecuta como root."
            exit 1
          fi
          echo "La API se ejecuta con el usuario $USER_ID."

      - name: Logs del contenedor
        if: failure()
        run: docker logs api

      - name: Exportar la imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE_NAME:ci" | gzip > image.tar.gz

      - name: Guardar la imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # Solo en main y si todo se aprueba: publica la misma imagen probada (SDD 5.4).
  publish:
    name: Publicar en Docker Hub
    needs: [version, quality, integration, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la imagen probada
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Cargar la imagen
        run: gunzip -c image.tar.gz | docker load

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y publicar
        env:
          IMAGE: ${{ secrets.DOCKERHUB_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for TAG in "$VERSION" latest; do
            docker tag "$IMAGE_NAME:ci" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
